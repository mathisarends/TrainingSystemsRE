[project]
name = "training-system"
version = "0.1.0"
description = "Personal periodized-training backend"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "apscheduler>=3.11",
    "asyncpg>=0.30",
    "dishka>=1.6",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pyjwt>=2.9",
    "pydantic-settings>=2.8",
    "pywebpush>=2.0",
    "sqlmodel>=0.0.24",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21",
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=7.1.0",
    "ruff>=0.11",
]

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "training_system"
module-root = ""

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
source = ["training_system"]
omit = ["training_system/main.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.$",
]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["migrations/versions"]

[[tool.mypy.overrides]]
module = ["apscheduler.*", "pywebpush.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
